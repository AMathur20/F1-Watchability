type: vertical-stack
cards:
  - type: custom:button-card
    color_type: label-card
    name: F1 Watchability Scores
    styles:
      card:
        - background: none
        - box-shadow: none
      name:
        - font-family: 'Formula1-Display-Bold', 'Inter', sans-serif
        - font-size: 24px
        - font-weight: bold
        - color: white
        - text-shadow: 0 0 10px rgba(255,255,255,0.5)

  - type: horizontal-stack
    cards:
      # --- LEFT COLUMN (Latest 2 Races) ---
      - type: vertical-stack
        cards:
          # RACE 0 (Lateest)
          - type: custom:button-card
            entity: sensor.f1_watchability
            template: f1_race_card_large
            variables:
              history_index: 0
            
          # RACE 1
          - type: custom:button-card
            entity: sensor.f1_watchability
            template: f1_race_card_large
            variables:
              history_index: 1

      # --- RIGHT COLUMN (Older 3 Races) ---
      - type: vertical-stack
        cards:
          # RACE 2
          - type: custom:button-card
            entity: sensor.f1_watchability
            template: f1_race_card_small
            variables:
              history_index: 2
            
          # RACE 3
          - type: custom:button-card
            entity: sensor.f1_watchability
            template: f1_race_card_small
            variables:
              history_index: 3

          # RACE 4
          - type: custom:button-card
            entity: sensor.f1_watchability
            template: f1_race_card_small
            variables:
              history_index: 4
