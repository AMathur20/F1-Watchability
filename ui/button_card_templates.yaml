button_card_templates:
  f1_container:
    styles:
      card:
        - background-color: '#111111'
        - font-family: '''Formula1-Display-Bold'', sans-serif !important'
        - font-weight: bold !important
        - font-style: italic !important
        - text-transform: uppercase
        - background-image: url("/local/images/f1_background.jpg")
        - background-position: center
        - background-repeat: no-repeat
        - background-size: cover;
        - border: 0px none
        - border-radius: 24px
        - padding: 30px
        - display: grid
        - place-items: center
        - align-content: center
        - box-shadow: >
            inset 0 0 60px rgba(0,0,0,1), 0 0 20px rgba(255, 24, 1, 0.3), 0 12px
            30px rgba(0, 162, 255, 0.3)
  f1_base:
    variables:
      history_index: 0
    aspect_ratio: 2.1/1
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - background: none
        - backdrop-filter: blur(7px)
        - border-radius: 14px
        - border: 1px none rgba(255, 255, 255, 0.1)
        - box-shadow: 0 4px 15px rgba(0,0,0,0.5)
        - overflow-wrap: break-word
        - font-family: '''Formula1-Display-Bold'', sans-serif !important'
        - font-weight: bold !important
        - font-style: italic !important
        - text-transform: uppercase
        - letter-spacing: 1px
  f1_race_card_large:
    template: f1_base
    styles:
      grid:
        - grid-template-areas: '"header header" "gauge info"'
        - grid-template-columns: 1fr 1fr
        - padding: 12px
      custom_fields:
        header:
          - font-family: '''Formula1-Display-Bold'', sans-serif'
          - font-size: 14px
          - color: white
          - justify-self: start
          - text-shadow: 0 2px 4px black
          - margin-bottom: 8px
          - margin-top: 7px
          - overflow-wrap: break-word
        gauge:
          - width: 100%
          - padding-top: 5px
        info:
          - justify-self: center
          - align-self: center
    custom_fields:
      header: |
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return "No Data";
          return `<span style="font-size:12px; text-transform:uppercase; line-height:1.2; white-space: normal; word-break: break-word;">${h[i].gp} </span>`;
        ]]]
      gauge: |
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return '';
          var s = h[i].score;
          var c = (s >= 8) ? '#00ff41' : (s >= 5) ? '#ffd700' : '#ff1801';
          return `
            <svg viewBox="0 0 100 85">
              <defs>
                <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#ff1801" />
                  <stop offset="50%" stop-color="#ffd700" />
                  <stop offset="100%" stop-color="#00ff41" />
                </linearGradient>
              </defs>
              <path d="M15,75 A35,35 0 0,1 85,75" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round" />
              <path d="M15,75 A35,35 0 0,1 85,75" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" 
                    stroke-dasharray="120" stroke-dashoffset="${120 - (120 * s / 10)}" />
              <text x="50" y="72" text-anchor="middle" fill="white" font-family="'Formula1-Display-Bold'" font-size="24" style="text-shadow: 0 0 10px ${c}">${parseFloat(h[i].score).toFixed(1)}</text>
            </svg>`;
        ]]]
      info: |
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return '';
          var text = (h[i].score >= 8) ? 'Full Race' : (h[i].score >= 5) ? 'Race in 30' : 'Highlights';
          return `
            <div style="text-align:center;">
              <div style="color:white; font-family:'Formula1-Display-Bold'; font-size:12px; text-transform:uppercase; line-height:1.2; letter-spacing: 1px; white-space: normal; word-break: break-word;">${text}</div>
            </div>`;
        ]]]
  f1_race_card_small:
    template: f1_base
    aspect_ratio: 3.2/1
    styles:
      grid:
        - grid-template-areas: '"score gp"'
        - grid-template-columns: 65px 1fr
        - align-items: center
        - padding: 10px
    custom_fields:
      score: |
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return '';
          var s = parseFloat(h[i].score).toFixed(1);
          
          var c = (s >= 8) ? '#00ff41' : (s >= 5) ? '#ffd700' : '#ff1801';
          return `<div style="color:${c}; font-family:'Formula1-Display-Bold'; font-size:26px; text-shadow: 0 0 10px ${c}aa;">${s}</div>`;
        ]]]
      gp: |
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return '';
          return `
            <div style="display:flex; flex-direction:column; margin-left:5px;">
              <div style="color:white; font-family:'Formula1-Display-Bold'; font-size:11px; line-height:1.2; white-space: normal; word-break: break-word;">${h[i].gp}</div>

            </div>`;
        ]]]
  f1_countdown:
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 0px 0px 20px 0px
    custom_fields:
      content: |
        [[[
          var next_race = entity.attributes.next_race;
          if (!next_race || next_race === 'null') return `<div style="color:white; font-family:'Formula1-Display-Bold'; font-size:14px; text-align:center;">Next Race: TBD</div>`;
          
          var raceName = next_race.gp_name;
          var raceDate = new Date(next_race.race_date).getTime();
          
          var uid = "cd_" + Math.random().toString(36).substr(2, 9);
          
          setTimeout(() => {
            var interval = setInterval(() => {
              var el = document.getElementById(uid);
              if (!el) {
                clearInterval(interval);
                return;
              }
              var now = new Date().getTime();
              var distance = raceDate - now;
              
              if (distance < 0) {
                el.innerHTML = `${raceName} (Now / Finished)`;
                clearInterval(interval);
                return;
              }
              
              var days = Math.floor(distance / (1000 * 60 * 60 * 24));
              var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
              var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
              var seconds = Math.floor((distance % (1000 * 60)) / 1000);
              
              el.innerHTML = `${raceName} in ${days}d ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
          }, 0);
          
          return `<div style="color:white; font-family:'Formula1-Display-Bold'; font-size:14px; text-align:center; text-shadow: 0 0 10px rgba(255,255,255,0.4);">Next Race: <span id="${uid}">Loading...</span></div>`;
        ]]]