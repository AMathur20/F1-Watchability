button_card_templates:
  f1_container:
    styles:
      card:
        - background-color: "#111111"
        - font-family: "'Formula1-Display-Bold', sans-serif !important"
        - font-weight: bold !important  # Tells the browser to use the 'bold' face defined in CSS
        - font-style: italic !important # Slants the text to match the F1 "Speed" aesthetic
        - text-transform: uppercase
        # Increased pattern scale slightly for better visibility
        - background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzhh2uGAAZAJ2CBGMIYhCDUAR98O9V9G9SIAAAAASUVORK5CYII=")
        - background-repeat: repeat
        - background-size: 6px 6px
        - border: 1px solid #333
        - border-radius: 24px
        - padding: 30px
        # These three lines fix the centering
        - display: grid
        - place-items: center 
        - align-content: center
        - box-shadow: >
            inset 0 0 60px rgba(0,0,0,1),
            0 0 20px rgba(255, 24, 1, 0.3),
            0 12px 30px rgba(0, 162, 255, 0.3)

  f1_base:
    variables:
      history_index: 0
    aspect_ratio: 2.1/1
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - background: rgba(35, 35, 35, 0.7) # Slightly darker for better contrast
        - backdrop-filter: blur(12px)
        - border-radius: 14px
        - border: 1px solid rgba(255, 255, 255, 0.1)
        - box-shadow: 0 4px 15px rgba(0,0,0,0.5)
        - overflow-wrap: break-word
        - font-family: "'Formula1-Display-Bold', sans-serif !important"
        - font-weight: bold !important  # Tells the browser to use the 'bold' face defined in CSS
        - font-style: italic !important # Slants the text to match the F1 "Speed" aesthetic
        - text-transform: uppercase
        - letter-spacing: 1px

  # Large card (Left Column)
  f1_race_card_large:
    template: f1_base
    styles:
      grid:
        - grid-template-areas: '"header header" "gauge info"'
        - grid-template-columns: 1fr 1fr
        - padding: 12px
      custom_fields:
        header:
          - font-family: "'Formula1-Display-Bold', sans-serif"
          - font-size: 14px
          - color: "white"
          - justify-self: start
          - text-shadow: 0 2px 4px black
          - margin-bottom: 8px
          - overflow-wrap: break-word
        gauge:
          - width: 100%
          - padding-top: 5px
        info:
          - justify-self: center
          - align-self: center
    custom_fields:
      header: >
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return "No Data";
          return `<span style="font-size:12px; text-transform:uppercase; line-height:1.2; white-space: normal; word-break: break-word;">${h[i].gp} </span>`;
        ]]]
      gauge: >
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return '';
          var s = h[i].score;
          var c = (s >= 8) ? '#00ff41' : (s >= 5) ? '#ffd700' : '#ff1801';
          return `
            <svg viewBox="0 0 100 85">
              <defs>
                <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#ff1801" />
                  <stop offset="50%" stop-color="#ffd700" />
                  <stop offset="100%" stop-color="#00ff41" />
                </linearGradient>
              </defs>
              <path d="M15,75 A35,35 0 0,1 85,75" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round" />
              <path d="M15,75 A35,35 0 0,1 85,75" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" 
                    stroke-dasharray="120" stroke-dashoffset="${120 - (120 * s / 10)}" />
              <text x="50" y="72" text-anchor="middle" fill="white" font-family="'Formula1-Display-Bold'" font-size="24" style="text-shadow: 0 0 10px ${c}">${s}</text>
            </svg>`;
        ]]]
      info: >
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return '';
          var text = (h[i].score >= 8) ? 'Full Race' : (h[i].score >= 5) ? 'Race in 30' : 'Highlights';
          return `
            <div style="text-align:center;">
              <div style="color:white; font-family:'Formula1-Display-Bold'; font-size:12px; text-transform:uppercase; line-height:1.2; letter-spacing: 1px; white-space: normal; word-break: break-word;">${text}</div>
            </div>`;
        ]]]

  # Small card (Right Column)
  f1_race_card_small:
    template: f1_base
    aspect_ratio: 3.2/1
    styles:
      grid:
        - grid-template-areas: '"score gp"'
        - grid-template-columns: 65px 1fr
        - align-items: center
        - padding: 10px
    custom_fields:
      score: >
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return '';
          var s = h[i].score;
          var c = (s >= 8) ? '#00ff41' : (s >= 5) ? '#ffd700' : '#ff1801';
          return `<div style="color:${c}; font-family:'Formula1-Display-Bold'; font-size:26px; text-shadow: 0 0 10px ${c}aa;">${s}</div>`;
        ]]]
      gp: >
        [[[
          var i = variables.history_index;
          var h = entity.attributes.history;
          if (!h || !h[i]) return '';
          return `
            <div style="display:flex; flex-direction:column; margin-left:5px;">
              <div style="color:white; font-family:'Formula1-Display-Bold'; font-size:11px; line-height:1.2; white-space: normal; word-break: break-word;">${h[i].gp}</div>
  
            </div>`;
        ]]]
