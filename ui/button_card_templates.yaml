f1_base:
  variables:
    history_index: 0
  aspect_ratio: 2/1
  show_icon: false
  show_name: false
  show_state: false
  styles:
    card:
      - background: 'linear-gradient(145deg, #1e1e1e, #121212)'
      - border-radius: 12px
      - border: 2px solid var(--border-color)
      - box-shadow: 0 0 15px var(--glow-color)
      - overflow: hidden
      - transition: all 0.3s ease-out
    grid:
      - grid-template-areas: '"header" "content"'
      - grid-template-rows: min-content 1fr
      - grid-template-columns: 1fr
  extra_styles: |
    @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  state:
    - operator: template
      value: >
        [[[ return true; ]]]
      styles:
        card:
          - --border-color: >
              [[[ 
                var i = variables.history_index;
                var h = entity.attributes.history;
                if (!h || !h[i]) return '#333';
                var s = h[i].score;
                if (s >= 8.0) return '#ff1801';
                if (s >= 5.0) return '#ffd700';
                return '#444';
              ]]]
          - --glow-color: >
              [[[ 
                var i = variables.history_index;
                var h = entity.attributes.history;
                if (!h || !h[i]) return 'transparent';
                var s = h[i].score;
                if (s >= 8.0) return 'rgba(255, 24, 1, 0.4)';
                if (s >= 5.0) return 'rgba(255, 215, 0, 0.4)';
                return 'rgba(68, 68, 68, 0.2)';
              ]]]

f1_race_card_large:
  template: f1_base
  styles:
    grid:
      - grid-template-areas: '"header header" "gauge info"'
      - grid-template-columns: 1fr 1.5fr
      - padding: 12px
  custom_fields:
    header:
      card:
        type: custom:button-card
        styles:
          card: [background: none, box-shadow: none, border: none]
          name: [font-family: 'Formula1-Display-Bold', font-size: 16px, color: white, justify-self: start]
        name: >
          [[[
            var i = variables.history_index;
            var h = entity.attributes.history;
            if (!h || !h[i]) return "No Data";
            return h[i].gp + " " + (h[i].date ? h[i].date.split('-')[0] : '');
          ]]]
    gauge:
      card:
        type: custom:button-card
        styles:
          card: [background: none, box-shadow: none, border: none]
          custom_fields:
            circle:
              - position: absolute
              - top: 0
              - left: 0
              - width: 100%
              - height: 100%
            val:
              - position: absolute
              - top: 50%
              - left: 50%
              - transform: translate(-50%, -50%)
              - font-family: 'Formula1-Display-Bold'
              - font-size: 28px
              - font-weight: bold
              - color: white
        custom_fields:
          val: >
            [[[
              var i = variables.history_index;
              var h = entity.attributes.history;
              return (h && h[i]) ? h[i].score : '-';
            ]]]
          circle: >
            [[[
              var i = variables.history_index;
              var h = entity.attributes.history;
              if (!h || !h[i]) return '';
              var s = h[i].score;
              var pct = s * 10;
              var c = (s >= 8) ? '#ff1801' : (s >= 5) ? '#ffd700' : '#444';
              return `<svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" stroke="#333" stroke-width="6" fill="none" />
                <circle cx="50" cy="50" r="45" stroke="${c}" stroke-width="6" fill="none" stroke-dasharray="283" stroke-dashoffset="${283 - (283 * pct / 100)}" transform="rotate(-90 50 50)" />
              </svg>`;
            ]]]
    info:
      card:
        type: custom:button-card
        styles:
          card: [background: none, box-shadow: none, border: none, align-items: start, justify-content: center]
          grid: [grid-template-areas: '"icon text"', grid-template-columns: '40px 1fr', gap: '8px']
          img_cell: [align-self: center]
          name: [color: '#ccc', font-size: 14px, align-self: center]
        custom_fields:
          icon: >
            [[[
              var i = variables.history_index;
              var h = entity.attributes.history;
              if (!h || !h[i]) return '';
              var icon = h[i].icon;
              if (icon === '🏎️') return `<div style="font-size:30px; animation: glitch 2s infinite;">🏎️</div>`;
              if (icon === '⏱️') return `<div style="font-size:30px;"><div style="display:inline-block; animation: rotate 2s linear infinite;">⏱️</div></div>`;
              return `<div style="font-size:30px;">${icon}</div>`;
            ]]]
          text: >
            [[[
              var i = variables.history_index;
              var h = entity.attributes.history;
              if (!h || !h[i]) return '';
              var s = h[i].score;
              if (s >= 8) return 'Full Race';
              if (s >= 5) return 'Race in 30';
              return 'Highlights';
            ]]]

f1_race_card_small:
  template: f1_base
  aspect_ratio: 4/1
  styles:
    grid:
      - grid-template-areas: '"score icon gp"'
      - grid-template-columns: '60px 50px 1fr'
      - align-items: center
      - padding: 0 16px
  custom_fields:
    score:
      - font-family: 'Formula1-Display-Bold'
      - font-size: 24px
      - font-weight: bold
      - color: >
          [[[
            var i = variables.history_index;
            var h = entity.attributes.history;
            if (!h || !h[i]) return '#fff';
            var s = h[i].score;
            return (s >= 8) ? '#ff1801' : (s >= 5) ? '#ffd700' : '#888';
          ]]]
    icon: >
      [[[
        var i = variables.history_index;
        var h = entity.attributes.history;
        if (!h || !h[i]) return '';
        return `<div style="font-size:24px;">${h[i].icon}</div>`;
      ]]]
    gp: >
      [[[
        var i = variables.history_index;
        var h = entity.attributes.history;
        return (h && h[i]) ? h[i].gp : 'No Data';
      ]]]
