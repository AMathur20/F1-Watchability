version: '3.8'

services:
  f1-watchability:
    build: .
    container_name: f1-watchability
    restart: unless-stopped
    volumes:
      # Mount cache for persistence (Required)
      - f1_cache:/app/f1_cache
      # Mount history for persistence (Required)
      - f1_history:/app/f1_history.json
      # Mount weights (Required if custom, otherwise built-in)
      # - ./weights.json:/app/weights.json
    environment:
      - PYTHONUNBUFFERED=1
      # MQTT Configuration (Can be set here or in Portainer UI)
      - MQTT_BROKER=192.168.1.X
      - MQTT_PORT=1883
      - MQTT_USERNAME=your_username
      - MQTT_PASSWORD=your_password
      - CHECK_INTERVAL=3600

volumes:
  f1_cache:
  f1_history:
