services:
  f1-watchability:
    build: .
    container_name: f1-watchability
    restart: unless-stopped
    volumes:
      # Mount cache for persistence (Required)
      - ./f1_cache:/app/f1_cache
      # Mount history for persistence (Required)
      - ./f1_history.json:/app/f1_history.json
      # Mount config and weights
      - ./config.json:/app/config.json
      - ./weights.json:/app/weights.json
    environment:
      - PYTHONUNBUFFERED=1
