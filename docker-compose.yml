version: '3.8'

services:
  f1-watchability:
    build: .
    container_name: f1-watchability
    restart: unless-stopped
    volumes:
      # Mount a volume to /data for persistence (History + Cache)
      - f1_data:/data
      # Mount weights if you want them external/updated
      # - ./weights.json:/app/weights.json
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/data
      # MQTT Configuration
      - MQTT_BROKER=192.168.1.X
      - MQTT_PORT=1883
      - MQTT_USERNAME=your_username
      - MQTT_PASSWORD=your_password
      - CHECK_INTERVAL=3600

volumes:
  f1_data:
